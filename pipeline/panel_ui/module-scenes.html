<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio · 模块场景</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/module-scenes.css"><script defer src="/navigation.js"></script><script defer src="/sprite-editor.js"></script><script defer src="/module-scenes.js"></script></head>
<body><nav id="studio-navigation"></nav><main class="module-workspace">
<header class="scene-header"><div><h1>模块场景 <small>素材验证</small></h1><p id="status" role="status">选择素材后在画布放置，或拖动已有物件。</p></div><div class="module-toolbar"><button id="new-scene">新建</button><button id="delete-scene" class="danger">删除场景</button><button id="save-layout">保存 <kbd>⌘S</kbd></button><a id="export" download="studio-module-scene.zip" hidden>导出 Godot</a></div></header>
<section class="scene-browser" aria-label="验证场景"><div id="scene-cards" class="scene-grid"></div></section>
<dialog id="new-dialog"><form method="dialog"><h2>新建场景</h2><input id="scene-title" placeholder="场景名称" aria-label="新场景名称" maxlength="80"><div class="module-toolbar"><button value="cancel">取消</button><button id="create" type="button">创建</button></div></form></dialog>
<section id="workspace" hidden>
<aside class="asset-library"><div class="section-heading"><h2>素材</h2><button id="show-library">＋ 素材库</button></div><p>点击图片选择素材，再在画布中放置；也可直接拖入画布。</p><div id="asset-cards"></div><button id="open-editor">编辑素材设置…</button><button id="replace-source">替换引用版本…</button><a id="source-link" class="source-link" hidden>查看当前素材版本 ↗</a><button id="show-import">导入新的透明 PNG…</button><p class="library-help">选中场景物件后，双击可编辑素材锚点和碰撞。</p></aside>
<div class="scene-area"><div class="scene-tools module-toolbar"><div class="tool-buttons"><button data-tool="select" title="选择与移动 V">选择 <kbd>V</kbd></button><button data-tool="place" title="连续放置 B">放置 <kbd>B</kbd></button><button data-tool="spawn" title="设置测试角色出生点">出生点</button></div><label><input id="snap" type="checkbox" checked>吸附</label><label><input id="show-collision" type="checkbox" checked>碰撞</label><button id="undo" title="撤销 ⌘Z">撤销</button><button id="redo" title="重做 ⌘Shift Z">重做</button><button id="duplicate" title="复制 ⌘D">复制</button><button id="delete" title="删除 Delete">删除</button></div>
<div class="canvas-wrap"><canvas id="scene-canvas" width="1000" height="640" tabindex="0" aria-label="场景模块摆放"></canvas><div class="view-controls"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="reset-view">适合画布</button></div></div>
<footer><span id="layout-summary"></span><span>滚轮缩放 · 空格拖动平移 · Esc 返回选择 · 方向键微调</span></footer>
<div class="selection-bar"><span id="selection-label">未选中物件</span><label>X <input id="instance-x" type="number" aria-label="选中物件 X"></label><label>Y <input id="instance-y" type="number" aria-label="选中物件 Y"></label><button id="edit-selected">编辑素材</button></div>
</div></section>
<dialog id="library-dialog"><header class="section-heading"><h2>选用 Studio 素材</h2><button id="close-library">关闭</button></header><p>引用独立物件、等距地面与过渡、水岸、建筑及可交付人物动作集，检查比例、通行与遮挡。围栏套件尚未适配。</p><input id="library-search" placeholder="搜索名称或版本编号" aria-label="搜索素材"><div id="library-assets"></div></dialog>
<dialog id="import-dialog"><form id="import-form"><h2>导入透明 PNG</h2><label>素材名称<input id="module-title" required maxlength="80"></label><label>透明 PNG（最大2048px）<input id="image-file" type="file" accept="image/png" required></label><div class="module-toolbar"><button type="button" id="cancel-import">取消</button><button>导入素材库并选用</button></div></form></dialog>

</main></body></html>
