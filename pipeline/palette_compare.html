<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>人物颜色聚类对照</title>
<style>body{font:15px system-ui;background:#edf0ed;color:#243c32;margin:28px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:22px}select,button{padding:9px;border:1px solid #b5c2b9;border-radius:6px}main{display:flex;gap:16px;flex-wrap:wrap}article{background:white;padding:16px;border-radius:10px;flex:1;min-width:250px}canvas{image-rendering:pixelated;display:block;margin:auto;background:repeating-conic-gradient(#e1e5df 0% 25%,#eef0eb 0% 50%) 0/16px 16px;max-width:100%;height:auto}p{line-height:1.6}input{width:min(600px,80vw)}</style>
<h1>96px 人物 · 原色 / 64 色 / 32 色</h1><p>同一人物的全部动作共用固定调色板，无抖动，透明度不变。三个画面使用同一播放时间。此为实验对照，不会修改原资产。</p>
<header><label>动作 <select id="clip"></select></label><label>显示 <select id="zoom"><option value="1">1× 实际像素</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><button id="toggle">暂停</button><span id="time"></span></header>
<p><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放位置"></p><main></main>
<script>
(async()=>{const clips=await(await fetch('clips.json')).json(),report=await(await fetch('report.json')).json();let position=0,playing=true,last=performance.now(),images=[],serial=0;const select=document.querySelector('#clip'),zoom=document.querySelector('#zoom'),seek=document.querySelector('#seek');
for(const name of Object.keys(clips)){const option=document.createElement('option');option.value=name;option.textContent=name;select.append(option);}
const views=['original','64','32'].map((variant,i)=>{const article=document.createElement('article');article.innerHTML='<h2>'+['原色','64 色','32 色'][i]+'</h2><canvas></canvas><p></p>';document.querySelector('main').append(article);return {variant,canvas:article.querySelector('canvas'),detail:article.querySelector('p')};});
async function load(){const token=++serial,clip=clips[select.value];images=[];position=0;const loaded=await Promise.all(views.map(async view=>{const img=new Image();img.src=view.variant+'/'+clip.sheet;await img.decode();return img;}));if(token!==serial)return;images=loaded;for(const view of views){view.canvas.width=clip.frame_width;view.canvas.height=clip.frame_height;view.canvas.style.width=clip.frame_width*Number(zoom.value)+'px';const bytes=report.variants[view.variant].clips[clip.sheet].png_bytes;view.detail.textContent=(bytes/1024).toFixed(1)+' KB · '+clip.frame_count+' 帧 · '+clip.duration_seconds.toFixed(2)+' 秒';}}
select.onchange=load;zoom.onchange=()=>{for(const v of views)v.canvas.style.width=clips[select.value].frame_width*Number(zoom.value)+'px';};document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'暂停':'播放';};seek.oninput=()=>{playing=false;document.querySelector('#toggle').textContent='播放';position=Number(seek.value)/1000*clips[select.value].duration_seconds;};
function tick(now){const clip=clips[select.value];if(playing)position=(position+(now-last)/1000)%clip.duration_seconds;last=now;if(images.length===3){const frame=Math.min(clip.frame_count-1,Math.floor(position/clip.duration_seconds*clip.frame_count));views.forEach((v,i)=>{const ctx=v.canvas.getContext('2d');ctx.clearRect(0,0,clip.frame_width,clip.frame_height);ctx.imageSmoothingEnabled=false;ctx.drawImage(images[i],frame%clip.columns*clip.frame_width,Math.floor(frame/clip.columns)*clip.frame_height,clip.frame_width,clip.frame_height,0,0,clip.frame_width,clip.frame_height);});document.querySelector('#time').textContent=position.toFixed(2)+' 秒 · 第 '+(frame+1)+' 帧';seek.value=position/clip.duration_seconds*1000;}requestAnimationFrame(tick);}
await load();requestAnimationFrame(tick);})();
</script></html>
